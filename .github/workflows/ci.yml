name: APPSIGN CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Core, CLI, and Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for scripts
        run: chmod +x scripts/appsign

      - name: Run APPSIGN CORE & CLI tests
        run: ./gradlew :appsign-core:test :appsign-cli:test --stacktrace

      - name: Build standalone CLI fat JAR
        run: ./gradlew :appsign-cli:fatJar --stacktrace

      - name: Smoke test appsign CLI script
        run: |
          ./scripts/appsign --version
          ./scripts/appsign --help

      - name: Run Android Robolectric & unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Android Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload build artifacts (APK + CLI)
        uses: actions/upload-artifact@v4
        with:
          name: appsign-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            appsign-cli/build/libs/appsign-cli-all.jar
            scripts/appsign
