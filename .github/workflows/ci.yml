name: APPSIGN CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Core, CLI, and Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36
            platforms;android-36.1
            build-tools;36.0.0

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Grant execute permission for scripts
        run: chmod +x scripts/appsign

      - name: Run APPSIGN CORE & CLI tests
        run: gradle :appsign-core:test :appsign-cli:test --stacktrace

      - name: Build standalone CLI fat JAR
        run: gradle :appsign-cli:fatJar --stacktrace

      - name: Smoke test appsign CLI script
        run: |
          ./scripts/appsign --version
          ./scripts/appsign --help

      - name: Run Android Robolectric & unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Android Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload build artifacts (APK + CLI)
        uses: actions/upload-artifact@v4
        with:
          name: appsign-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            appsign-cli/build/libs/appsign-cli-all.jar
            scripts/appsign
